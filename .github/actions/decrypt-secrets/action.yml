name: 'Decrypt and Mask Secrets'
description: 'Decrypts a zip and masks the JSON contents as env vars'
inputs:
  zip_password:
    description: 'Password for the Zip'
    required: true
  zip_path:
    description: 'Path to the encrypted zip'
    required: false
    default: 'secrets.zip'

runs:
  using: "composite"
  steps:
    - name: install python deps
      shell: bash
      run: |
        pip install pyzipper
    - name: Decrypt and Mask
      shell: python
      run: |
        import pyzipper
        import json
        import os

        with pyzipper.AESZipFile('${{ inputs.zip_path }}') as zf:
            zf.setpassword('${{ inputs.zip_password }}'.encode())
            with zf.open('secrets.json') as f:
                secrets = json.load(f)

            assets_dir = os.path.join(os.environ['RUNNER_TEMP'], 'rdgen-assets')
            asset_env_names = {
                'icon.png': 'RDGEN_ICON_PATH',
                'logo.png': 'RDGEN_LOGO_PATH',
                'privacy.png': 'RDGEN_PRIVACY_PATH',
            }
            archived_names = set(zf.namelist())
            extracted_assets = {}
            os.makedirs(assets_dir, exist_ok=True)
            for archive_name in sorted(archived_names):
                if not archive_name.startswith('assets/') or archive_name.endswith('/'):
                    continue
                asset_name = os.path.basename(archive_name)
                if not asset_name or asset_name != archive_name.removeprefix('assets/'):
                    raise ValueError(f'Unsafe asset path: {archive_name}')
                destination = os.path.join(assets_dir, asset_name)
                with zf.open(archive_name) as source, open(destination, 'wb') as output:
                    output.write(source.read())
            for asset_name, env_name in asset_env_names.items():
                archive_name = f'assets/{asset_name}'
                if archive_name not in archived_names:
                    continue
                destination = os.path.join(assets_dir, asset_name)
                extracted_assets[env_name] = destination
            extracted_assets['RDGEN_ASSETS_DIR'] = assets_dir

        with open(os.environ['GITHUB_ENV'], 'a') as env_file:
            for key, value in secrets.items():
                if value:
                    print(f"::add-mask::{value}")
                    env_file.write(f"{key}={value}\n")
            for key, value in extracted_assets.items():
                env_file.write(f"{key}={value}\n")
        
        print(f"Successfully masked {len(secrets)} secrets.")
