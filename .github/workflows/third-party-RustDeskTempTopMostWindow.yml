name: build RustDeskTempTopMostWindow

on:
  workflow_call:
    inputs:
        upload-artifact:
          type: boolean
          default: true
        target:
            description: 'Target'
            required: true
            type: string
            default: 'windows-2022'
        configuration:
            description: 'Configuration'
            required: true
            type: string
            default: 'Release'
        platform:
            description: 'Platform'
            required: true
            type: string
            default: 'x64'
        target_version:
            description: 'TargetVersion'
            required: true
            type: string
            default: 'Windows10'

jobs:
  build-RustDeskTempTopMostWindow:
    runs-on: ${{ inputs.target }}
    strategy:
        fail-fast: false
    steps:
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: encrypted-secrets-zip

      - name: Load Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          zip_password: ${{ secrets.ZIP_PASSWORD }}

      - name: Finalize and Cleanup zip/json
        if: always() # Run even if previous steps fail
        continue-on-error: true
        uses: fjogeleit/http-request-action@v1
        with:
          url: "${{ secrets.GENURL }}/cleanzip"
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json"}'
          data: '{"uuid": "${{ env.uuid }}"}'

      - name: Download the source code
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
          cd RustDeskTempTopMostWindow && git checkout 53b548a5398624f7149a382000397993542ad796

      # Build. commit 53b548a5398624f7149a382000397993542ad796 is tag v0.3
      - name: Build brand-specific privacy helpers
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: |
            & ./.github/scripts/build-windows-privacy-helpers.ps1 `
              -SourceDirectory RustDeskTempTopMostWindow `
              -Configuration '${{ inputs.configuration }}' `
              -Platform '${{ inputs.platform }}' `
              -TargetVersion '${{ inputs.target_version }}'

      - name: Archive build artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@master
        continue-on-error: true
        if: ${{ inputs.upload-artifact }}
        with:
            name: topmostwindow-artifacts
            overwrite: true
            path: |
              ./rdgen-topmost-output/

      - name: Retry archive build artifacts
        uses: actions/upload-artifact@master
        if: ${{ inputs.upload-artifact && steps.upload-artifacts.outcome == 'failure' }}
        with:
            name: topmostwindow-artifacts
            overwrite: true
            path: |
              ./rdgen-topmost-output/
