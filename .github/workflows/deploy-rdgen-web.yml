name: Deploy RDGen web interface

on:
  push:
    branches: [master]
    paths:
      - 'rdgenerator/**'
      - 'rdgen/**'
      - 'requirements.txt'
      - '.github/workflows/deploy-rdgen-web.yml'
  workflow_dispatch:

concurrency:
  group: rdgen-web-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Update running RDGen service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceToRecover = $null
          trap {
            if ($serviceToRecover) {
              Start-Service -Name $serviceToRecover -ErrorAction SilentlyContinue
            }
            Write-Output "::error title=RDGen deployment failed::$($_.Exception.Message)"
            exit 1
          }
          $dockerCommand = Get-Command docker.exe -ErrorAction SilentlyContinue
          $docker = if ($dockerCommand) { $dockerCommand.Source } else { 'C:\Program Files\Docker\Docker\resources\bin\docker.exe' }
          if (Test-Path -LiteralPath $docker -PathType Leaf) {
            $containers = @(& $docker ps --filter 'publish=8000' --format '{{.ID}}')
            if ($LASTEXITCODE -eq 0 -and $containers.Count -eq 1) {
              $container = $containers[0]
              & $docker cp ./rdgenerator "$container`:/opt/rdgen/"
              if ($LASTEXITCODE -ne 0) { throw 'Could not update rdgenerator in the container.' }
              & $docker cp ./rdgen "$container`:/opt/rdgen/"
              if ($LASTEXITCODE -ne 0) { throw 'Could not update Django project files in the container.' }
              & $docker restart $container
              if ($LASTEXITCODE -ne 0) { throw 'Could not restart the RDGen container.' }
              exit 0
            }
          }

          $listener = Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction Stop | Select-Object -First 1
          $webProcess = Get-CimInstance Win32_Process -Filter "ProcessId=$($listener.OwningProcess)"
          $services = @(Get-CimInstance Win32_Service | Where-Object { $_.ProcessId -gt 0 })
          $service = $null
          $currentProcess = $webProcess
          for ($depth = 0; $depth -lt 5 -and $currentProcess; $depth++) {
            $service = $services | Where-Object { $_.ProcessId -eq $currentProcess.ProcessId } | Select-Object -First 1
            if ($service) { break }
            $parentId = $currentProcess.ParentProcessId
            $currentProcess = Get-CimInstance Win32_Process -Filter "ProcessId=$parentId" -ErrorAction SilentlyContinue
          }
          if (-not $service) {
            Write-Output "::error::Port 8000 belongs to $($webProcess.Name), but it is not a Windows service."
            throw 'Could not identify the RDGen Windows service.'
          }

          $parametersPath = "HKLM:\SYSTEM\CurrentControlSet\Services\$($service.Name)\Parameters"
          $appRoot = (Get-ItemProperty -LiteralPath $parametersPath -Name AppDirectory -ErrorAction SilentlyContinue).AppDirectory
          if ([string]::IsNullOrWhiteSpace($appRoot)) {
            $candidate = Split-Path -Parent $webProcess.ExecutablePath
            for ($depth = 0; $depth -lt 6 -and $candidate; $depth++) {
              if (Test-Path -LiteralPath (Join-Path $candidate 'manage.py') -PathType Leaf) {
                $appRoot = $candidate
                break
              }
              $parent = Split-Path -Parent $candidate
              if ($parent -eq $candidate) { break }
              $candidate = $parent
            }
          }
          if ([string]::IsNullOrWhiteSpace($appRoot) -or -not (Test-Path -LiteralPath (Join-Path $appRoot 'manage.py'))) {
            Write-Output "::error::Found service '$($service.Name)' but could not determine its application directory."
            throw 'Could not locate the live RDGen directory.'
          }

          $serviceToRecover = $service.Name
          Stop-Service -Name $service.Name -Force
          $runnerSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls.exe $appRoot /grant "*$($runnerSid):(OI)(CI)M" /T /C | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not grant deployment access to $appRoot." }
          Copy-Item ./rdgenerator/* (Join-Path $appRoot 'rdgenerator') -Recurse -Force
          Copy-Item ./rdgen/* (Join-Path $appRoot 'rdgen') -Recurse -Force
          Start-Service -Name $service.Name
          $serviceToRecover = $null
          Write-Host "Updated $appRoot and restarted $($service.Name)."

      - name: Verify generator health
        shell: pwsh
        run: |
          $url = 'http://127.0.0.1:8000/generator'
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            try {
              $response = Invoke-WebRequest $url -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200 -and $response.Content -match 'Additional branded clients') {
                Write-Host 'RDGen web interface is updated and healthy.'
                exit 0
              }
            } catch {
              Write-Host "Health check attempt $attempt failed."
            }
            Start-Sleep -Seconds 3
          }
          throw 'Updated RDGen interface did not become healthy.'
